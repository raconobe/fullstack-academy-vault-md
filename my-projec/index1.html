<!doctype html>
<html>
  <body>
    <h1>Include Demo</h1>

    <!-- This empty div will be replaced by the partial -->
    <div id="slot-header"></div>

    <p>Content between the includes.</p>

    <div id="slot-footer"></div>

    <script type="module">
      // Fetch a file and paste it into an element
      async function include(id, path) {
        const el = document.getElementById(id);
        const res = await fetch(path);
        el.innerHTML = await res.text();
      }

      include("slot-header", "partials/header.html");
      include("slot-footer", "partials/footer.html");
    </script>
  </body>
</html>
